# ================================================================
# Monolith (Pet Clinic) - port 8080
# ================================================================
server.port=8080
spring.application.name=monolith

# Database: in-memory HSQLDB, 시작할 때마다 schema.sql, data.sql로 초기화
spring.datasource.url=jdbc:hsqldb:mem:monolithdb
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/data.sql

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=true

# Web
spring.thymeleaf.mode=HTML

# Internationalization
spring.messages.basename=messages/messages

# Actuator: localhost:8080/manage/health
management.endpoints.web.base-path=/manage
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Logging
logging.level.org.springframework=INFO
